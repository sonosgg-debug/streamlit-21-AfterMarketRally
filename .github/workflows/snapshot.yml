name: 15:30 Market Close Snapshot Collector

on:
  schedule:
    # 1. 06:35 UTC = 15:35 KST (정규장 마감 직후 15:30 기준점 수집)
    - cron: '35 6 * * 1-5'
    # 2. 11:05 UTC = 20:05 KST (애프터마켓 최종 마감 후 전체 거래량/호가 확정 수집)
    - cron: '5 11 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI 'Actions' 탭에서 언제든지 수동 실행 가능
    inputs:
      force:
        description: '휴장일/공휴일 검사를 무시하고 강제 수집할지 여부 (기본: false)'
        required: false
        type: boolean
        default: false

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub 저장소에 스냅샷 파일 자동 Commit & Push 권한

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Snapshot Collector
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python snapshot_collector.py --force
          else
            python snapshot_collector.py
          fi

      - name: Commit and Push Snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Auto: 15:30 Market Close Snapshot [$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S') KST]"
            git push origin main
          fi
